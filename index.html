at > index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartVote V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#111827;color:white;text-align:center;padding:25px 15px}
.container{max-width:600px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:14px;box-shadow:0 3px 12px #0001}
#countdown{text-align:center;font-size:21px;font-weight:bold;padding:18px;border-radius:12px;background:#e8f5e9}
input,select,button{width:100%;padding:14px;margin-top:12px;border-radius:8px;font-size:16px}
input,select{border:1px solid #ccc}
button{border:0;background:#111827;color:white;font-weight:bold}
button:disabled{background:#999}
#message{text-align:center;font-weight:bold;margin-top:15px}
</style>
</head>

<body>
<header>
<h1>🗳️ SmartVote V2</h1>
<p>Secure Online Election System</p>
</header>

<div class="container">

<div class="card">
<h2>🗳️ Election Status</h2>
<div id="countdown">Loading election countdown...</div>
</div>

<div class="card">
<h2>👤 Cast Your Vote</h2>

<input id="reg" type="text" placeholder="Enter Voter ID">

<select id="candidate">
<option value="">Select Candidate</option>
<option value="Ian Dancan">Ian Dancan</option>
<option value="Brian Otieno">Brian Otieno</option>
<option value="Kevin Ochieng">Kevin Ochieng</option>
</select>

<button id="voteButton" onclick="vote()">VOTE</button>

<p id="message"></p>
</div>

</div>

<script>
const countdown = document.getElementById("countdown");
const voteButton = document.getElementById("voteButton");
const message = document.getElementById("message");

let electionEnded = false;
let remaining = 0;

async function loadStatus(){
  try{
    const response = await fetch("/status");

    if(!response.ok) throw new Error("Status request failed");

    const data = await response.json();

    remaining = data.remaining;

    if(!data.active){
      electionEnded = true;
      countdown.textContent = "🔒 Election has ended.";
      voteButton.disabled = true;
      return;
    }

    updateCountdown();

  }catch(error){
    console.error(error);
    countdown.textContent = "Unable to load election countdown.";
  }
}

function updateCountdown(){
  if(electionEnded) return;

  remaining -= 1000;

  if(remaining <= 0){
    electionEnded = true;
    countdown.textContent = "🔒 Election has ended.";
    voteButton.disabled = true;
    return;
  }

  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  countdown.textContent =
    `⏳ Election ends in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCountdown,1000);

async function vote(){

  if(electionEnded){
    message.textContent = "🔒 Voting is closed.";
    return;
  }

  const voterId = document.getElementById("reg").value.trim();
  const candidate = document.getElementById("candidate").value;

  if(!voterId || !candidate){
    message.textContent =
      "Please enter your Voter ID and select a candidate.";
    return;
  }

  voteButton.disabled = true;
  message.textContent = "Submitting your vote...";

  try{

    const response = await fetch("/vote",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        voterId:voterId,
        candidate:candidate
      })
    });

    const data = await response.json();

    if(!response.ok){
      message.textContent = "❌ " + data.message;
      voteButton.disabled = false;
      return;
    }

    message.textContent = "✅ Vote submitted successfully!";

    document.getElementById("reg").value = "";
    document.getElementById("candidate").value = "";

  }catch(error){

    console.error(error);
    message.textContent =
      "❌ Cannot connect to SmartVote server.";

  }

  if(!electionEnded){
    voteButton.disabled = false;
  }
}

loadStatus();
</script>

</body>
</html>
EOF
