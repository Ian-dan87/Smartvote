<!DOCTYPE html>
<html>
<head>
<title>SmartVote</title>
<style>
body{text-align:center;font-family:Arial;padding:30px}
input,button{padding:15px;margin:10px;width:85%}
button{background:#222;color:white;border:0;border-radius:8px}
#message{font-weight:bold}
</style>
</head>

<body>

<h1>🗳️ SmartVote</h1>

<input id="reg" placeholder="Enter Registration Number">

<button onclick="vote()">VOTE</button>

<p id="message"></p>

<script>
function vote(){
    document.getElementById("message").innerText =
    "Vote submitted successfully!";
}
</script>

</body>
</html>
